<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Crest Icon -->
  <g transform="translate(15, 10)">
    <!-- Crest Shield Background -->
    <rect x="0" y="0" width="60" height="60" rx="14" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
    
    <!-- Stylized Hotel Towers / Crown -->
    <path d="M 16 46 L 16 26 L 24 22 L 24 46 Z" fill="url(#goldGrad)"/>
    <path d="M 26 46 L 26 15 L 34 15 L 34 46 Z" fill="#FBBF24" filter="url(#glow)"/>
    <path d="M 36 46 L 36 22 L 44 26 L 44 46 Z" fill="url(#goldGrad)"/>
    
    <!-- Windows -->
    <rect x="28" y="20" width="4" height="4" rx="1" fill="#0F172A"/>
    <rect x="28" y="28" width="4" height="4" rx="1" fill="#0F172A"/>
    <rect x="28" y="36" width="4" height="4" rx="1" fill="#0F172A"/>
    
    <rect x="18" y="29" width="3" height="3" rx="0.5" fill="#0F172A"/>
    <rect x="18" y="36" width="3" height="3" rx="0.5" fill="#0F172A"/>
    <rect x="39" y="29" width="3" height="3" rx="0.5" fill="#0F172A"/>
    <rect x="39" y="36" width="3" height="3" rx="0.5" fill="#0F172A"/>

    <!-- 5 Star Accent -->
    <polygon points="30,8 32,12 36,12 33,14 34,18 30,15 26,18 27,14 24,12 28,12" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography -->
  <text x="88" y="38" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="24" fill="#FFFFFF" letter-spacing="1">
    GRAND<tspan fill="#F59E0B">STAY</tspan>
  </text>
  <text x="90" y="55" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="9.5" fill="#94A3B8" letter-spacing="3.5">
    HOTEL &amp; RESORT SUITES
  </text>
</svg>
